name: Respaldo semanal de la base de datos

on:
  schedule:
    # Todos los lunes 08:00 UTC (03:00 hora Perú). Railway no ofrece
    # respaldos automáticos en el plan gratuito, así que esto lo reemplaza.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install mysql2

      - name: Generar respaldo
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: node scripts/backup-db.js

      - name: Subir respaldo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-bd-${{ github.run_id }}
          path: backups/*.sql
          retention-days: 90

      # Las fotos viven solo en el volumen de Railway: se bajan por la URL
      # pública todas las que la base menciona (ver scripts/backup-fotos.js).
      # Va después de subir el .sql para que un fallo aquí no se lleve la base.
      - name: Respaldar fotos
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: node scripts/backup-fotos.js

      - name: Subir fotos como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-fotos-${{ github.run_id }}
          path: backups/fotos
          # Las fotos cambian poco y ocupan más que la base: con 30 días
          # quedan ~4 copias semanales.
          retention-days: 30
          # Ya vienen comprimidas (JPEG/WEBP): volver a comprimir no ahorra nada.
          compression-level: 0
